$schema: "https://moonrepo.dev/schemas/project.json"

project:
  name: "Web App (Ask Nugey)"
  description: "Ask Nugey is a web app that allows you to ask questions and get answers."

type: "application"
language: "node"
stack: "frontend"
tags:
  - "typescript"
  - "react"
  - "nextjs"
  - "web"
  - "frontend"

tasks:
  # 基本コマンド
  dev:
    description: "Next.js開発サーバーを起動"
    command:
      - "sh"
      - "-c"
      - "rm -rf .next && pnpm exec next dev & pnpm exec node scripts/watchPostSlugs.js & wait"
    inputs:
      - "src/**/*.{ts,tsx,js,jsx}"
      - "next.config.mjs"
      - "tailwind.config.js"
      - "package.json"
    #   - "shared:src/**/*.{ts,tsx}"
    #   - "shared:dist/**/*"
    deps:
      - "panda"
      - "generate-posts"
      # - "shared:build"
    options:
      persistent: true
      cache: false
      runFromWorkspaceRoot: false
      runInCI: false
    local: true

  build:
    description: "Next.jsプロダクション用ビルド"
    command: "pnpm exec next build"
    inputs:
      - "src/**/*.{ts,tsx,js,jsx}"
      - "public/**/*"
      - "next.config.mjs"
      - "package.json"
    deps:
      - "panda"
      # - "shared:build"

  start:
    description: "Next.jsプロダクションサーバーを起動"
    command: "pnpm exec next start"
    deps:
      - "build"
    options:
      persistent: true
      cache: false

  # Cloudflare
  build-worker:
    description: "Cloudflare Worker ビルド"
    command: "pnpm exec opennextjs-cloudflare build"
    deps:
      - "panda"
      - "generate-posts"
      - "cf-typegen"
    options:
      persistent: false
      cache: false

  deploy:
    description: "Cloudflare デプロイ"
    command: "pnpm exec opennextjs-cloudflare deploy -- --minify"
    deps:
      - "build-worker"
    options:
      persistent: false
      cache: false

  deploy-dry:
    description: "Cloudflare デプロイ（ドライラン）"
    command: "pnpm exec opennextjs-cloudflare deploy -- --minify --dry-run"
    deps:
      - "build-worker"
    options:
      persistent: false
      cache: false
    local: true

  cf-typegen:
    description: "Cloudflare 型生成"
    command: "pnpm exec wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts"
    options:
      persistent: false
      cache: false

  preview-worker:
    description: "Cloudflare Worker用プレビュー"
    command: "pnpm exec opennextjs-cloudflare preview"
    inputs:
      - "src/**/*.{ts,tsx,js,jsx}"
      - "public/**/*"
      - "next.config.mjs"
      - "package.json"
    deps:
      - "build-worker"
    local: true

  # その他
  generate-posts:
    description: "投稿スラグ生成"
    command: "pnpm"
    args: ["exec", "node", "scripts/generatePostSlugs.js"]
    inputs:
      - "scripts/generatePostSlugs.js"
      - "src/post/**/*"

  watch-posts:
    description: "投稿ファイル監視"
    command: "pnpm"
    args: ["exec", "node", "scripts/watchPostSlugs.js"]
    inputs:
      - "scripts/watchPostSlugs.js"
      - "src/post/**/*"
    options:
      persistent: true
      cache: false
      runFromWorkspaceRoot: false
      runInCI: false
    local: true

  panda:
    description: "Panda CSSコード生成"
    command: "pnpm exec panda codegen"
    inputs:
      - "panda.config.ts"
